# Publishes onboarding-template/ to npm as `system-explainer` when a release tag is pushed.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere. npmjs.com must
# list this repository + this workflow filename as the package's trusted publisher (package settings
# -> Trusted Publisher -> GitHub Actions: user `shaheershoaib`, repository `system-explainer`,
# workflow `publish.yml`). Provenance attestations are generated automatically.
#
# Release procedure: bump "version" in onboarding-template/package.json on main, then
#   git tag v<version> && git push origin v<version>
# The tag must match the package version or the job refuses to publish.
# `workflow_dispatch` with dry_run=true rehearses everything (gates, smoke, tarball) without publishing.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # the OIDC token npm exchanges for a short-lived publish credential

jobs:
  publish:
    name: Publish system-explainer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding-template
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: onboarding-template/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer; runners may ship an older 11.x.
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Refuse a tag that does not match package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$v" ]; then
            echo "tag $TAG does not match package version $v"; exit 1
          fi

      # A tag for a version that is already on npm (for example the first release, published by hand) is a no-op, not a failure.
      - name: Skip if this version is already published
        id: existing
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "system-explainer@$v" version >/dev/null 2>&1; then
            echo "system-explainer@$v is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs typecheck, tests, the SPA build, the CLI build and the offline smoke first.
      - name: Publish
        if: steps.existing.outputs.published == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        run: npm publish

      - name: Dry run (gates + tarball, no publish)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --dry-run
