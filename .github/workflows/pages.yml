name: Deploy course demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'onboarding-template/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onboarding-template/package-lock.json
      - run: npm ci
      # Project site: served from https://<user>.github.io/<repo>/, so the build base is /<repo>/.
      - run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build:pages
      # enablement needs a PAT/App token to self-enable Pages (per the action's docs); with the default
      # GITHUB_TOKEN, flip Settings > Pages > Source: "GitHub Actions" once, after which this is a no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: onboarding-template/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
